apiVersion: 1

datasources:
  - name: Banana PostgreSQL
    uid: banana-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
