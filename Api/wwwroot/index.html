<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Project Blueprint</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="icon" type="image/svg" href="resources/images/logo.svg">
</head>

<body>

<div id="header"></div>

<section class="search-section">
    <div class="container search-row">
        <button class="filter-btn">
            <img src="resources/images/filter.svg" alt="Фильтры" width="16" height="16">
            Фильтры
        </button>

        <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="gray" stroke-width="2" fill="none"/>
                <line x1="16" y1="16" x2="21" y2="21" stroke="gray" stroke-width="2"/>
            </svg>

            <label for="search-input">
                <input type="text" id="search-input" placeholder="Искать проект">
            </label>

            <button type="button" class="clear">×</button>
        </div>
    </div>
</section>

<section class="projects">
    <div class="container">
        <div class="projects-grid" id="projects-grid"></div>

        <template id="project-card-template">
            <a class="card">
                <h1 class="project-title"></h1>
                <p class="project-description"></p>

                <div class="stack">
                    <span>Стек:</span>
                    <div class="icons"></div>
                </div>
            </a>
        </template>
    </div>
</section>
<script src="js/projects.js"></script>
<script src="js/header.js"></script>
<script src="js/searchAndFilterHandler.js"></script>
<div id="footer"></div>
<script src="js/footer.js"></script>

</body>
</html>
