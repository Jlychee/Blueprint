<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Project Blueprint</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="icon" type="image/svg" href="resources/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div id="header"></div>

<section class="catalog-page">
    <div class="container catalog-layout" id="catalog-layout">
        <aside class="catalog-sidebar" id="catalog-sidebar">
            <div id="filters-container"></div>
        </aside>

        <div class="catalog-content">
            <section class="search-section">
                <div class="search-row">
                    <button class="filter-btn" type="button">
                        <img src="resources/images/filter.svg" alt="Фильтры" width="16" height="16">
                        <span>Фильтры</span>
                    </button>

                    <div class="search">
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7" stroke="gray" stroke-width="2" fill="none"/>
                            <line x1="16" y1="16" x2="21" y2="21" stroke="gray" stroke-width="2"/>
                        </svg>

                        <label for="search-input">
                            <input type="text" id="search-input" placeholder="Искать проект">
                        </label>

                        <button type="button" class="clear">×</button>
                    </div>
                </div>
            </section>

            <section class="projects">
                <div class="projects-grid" id="projects-grid"></div>

                <template id="project-card-template">
                    <a class="card">
                        <h1 class="project-title"></h1>
                        <p class="project-description"></p>

                        <div class="stack">
                            <span>Стек:</span>
                            <div class="icons"></div>
                        </div>
                    </a>
                </template>
            </section>
        </div>
    </div>
</section>

<script src="js/searchAndFilterHandler.js"></script>
<script src="js/filters.js"></script>
<script type="module" src="js/projects.js"></script>
<script src="js/header.js"></script>

<div id="footer"></div>
<script src="js/footer.js"></script>

</body>
</html>
