<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/linkOverlay.css">
    <script src="js/linkOverlay.js"></script>

</head>
<body>
<div class="overlay-bg" data-close-overlay></div>

<div class="overlay">
    <span class="close-btn" data-close-overlay>×</span>

    <h2>Ссылка на файл:</h2>
    <div class="link-wrapper">
        <label class="scroll-link-wrapper">
            <input type="text" id="fileLink" readonly>
        </label>
        <button class="copy-btn" data-copy-link="fileLink" type="button">
            <img src="resources/images/copy.svg" alt="скопировать">
        </button>

    </div>


    <h2>Ссылка на проект:</h2>
    <div class="link-wrapper">
        <label class="scroll-link-wrapper">
            <input type="text" id="projectLink" readonly>
        </label>
        <button class="copy-btn" data-copy-link="projectLink" type="button">
            <img src="resources/images/copy.svg" alt="скопировать">
        </button>
    </div>
</div>
</body>
</html>
