<aside class="filters">
    <div class="filters-head">
        <h1>Фильтры</h1>
        <button type="button" class="filters-close" id="filters-close" data-close-filters aria-label="Закрыть фильтры">
            ×
        </button>
    </div>

    <div class="filters-scroll">
        <div id="filter-tags-list"></div>

        <div class="filter-subsection">
            <button type="button" class="filter-subsection-title" data-filter-toggle>
                <img src="resources/images/chevron.svg"
                    class="filter-toggle-icon"
                    alt="">
                <h3>Год создания</h3>
            </button>
            <div class="filter-subsection-content">
                <div id="filter-years-list"></div>
            </div>
        </div>

        <button type="button" class="filters-reset" id="filters-reset">Сбросить</button>
    </div>
</aside>
