<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Project Blueprint</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header class="header">
  <div class="container header-row">

    <div class="logo">
      <img src="resources/images/logo.svg" alt="логотип с кроликом">
      <span class="logo-text">PROJECT<br> BLUEPRINT</span>
    </div>

    <nav class="nav">
      <a href="my-projects.html" class="nav-link">
        <img src="resources/images/my_proj.svg" alt="Мои проекты" width="16" height="16">
        Мои проекты
      </a>

      <a href="upload-project.html" class="nav-link">
        <img src="resources/images/upload.svg" alt="Загрузить проект" width="16" height="16">
        Загрузить проект
      </a>
    </nav>


  </div>
</header>


<section class="search-section">
  <div class="container search-row">
    <button class="filter-btn">
      <img src="resources/images/filter.svg" alt="Фильтры" width="16" height="16">
      Фильтры
    </button>

    <div class="search">

      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" stroke="gray" stroke-width="2" fill="none"/>
        <line x1="16" y1="16" x2="21" y2="21" stroke="gray" stroke-width="2"/>
      </svg>

      <input type="text" placeholder="Искать проект">

      <span class="clear">×</span>

    </div>

  </div>
</section>



<section class="projects">
  <div class="container">

    <div class="projects-grid" id="projects-grid"></div>

    <template id="project-card-template">
      <a class="card">
        <h1 class="project-title"></h1>
        <p class="project-description"></p>

        <div class="stack">
          <span>Стек:</span>
          <div class="icons"></div>
        </div>
      </a>
    </template>

  </div>
</section>
<script src="js/projects.js"></script>

</body>
</html>
