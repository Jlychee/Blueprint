worker_processes 1; # Определяет количество рабочих процессов

events {
    worker_connections 1024; # максимальное кол-во подключений
}


http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name projectblueprint.ru www.projectblueprint.ru;
        location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
               }
  location / {
    return 301 https://$host$request_uri;
  }
    }
    server {
  listen 443 ssl;
  server_name projectblueprint.ru www.projectblueprint.ru;

        ssl_certificate /etc/letsencrypt/live/projectblueprint.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projectblueprint.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /var/www/html;
            index index.html;

  try_files $uri $uri/ /index.html;
        }
    }
}