services:
  backend:
    build: .
    depends_on:
      - db
  db:
    image: postgres:15
    env_file:
      - .env  
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../Api/www:/var/www/html
    depends_on:
      - backend
    
volumes:
  postgres_data: 